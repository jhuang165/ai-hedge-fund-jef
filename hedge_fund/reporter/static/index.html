<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aihf reporter</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">aihf <span class="muted">reporter</span></div>
  <div class="status" id="status">
    <span class="dot" id="llm-dot" title="model endpoint"></span>
    <span id="status-text">connecting…</span>
  </div>
  <div class="topbar-right">
    <button class="ghost" id="refresh">refresh</button>
    <button class="primary small" id="run-now">Run now</button>
  </div>
</header>

<main>
  <section class="panel progress-panel" id="progress" hidden>
    <div class="bar"><div class="fill indeterminate"></div></div>
    <div class="progress-label" id="progress-label"></div>
  </section>

  <section id="dashboard">
    <div class="toolbar">
      <h2>Watchlist <span class="muted" id="dash-sub"></span></h2>
      <form id="add-form" class="add">
        <input id="add-ticker" placeholder="add ticker" autocomplete="off" spellcheck="false" maxlength="12">
        <button type="submit" class="small">add</button>
      </form>
    </div>
    <div class="cards" id="cards"><div class="empty">loading…</div></div>
  </section>

  <section id="detail" class="panel report" hidden></section>

  <section class="panel" id="runs-panel">
    <details>
      <summary>Recent cycles</summary>
      <div id="runs"></div>
    </details>
  </section>
</main>
<div class="foot">briefs are generated by a model from public sources and the fund's own quant readouts; nothing here is an order or advice. verify before acting.</div>
<script src="/static/app.js"></script>
</body>
</html>
